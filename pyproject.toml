[project]
name = "cutting-patterns"
version = "0.1.0"
description = "Sawing pattern simulator and generator for Thorpe Timbers (Ngome)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "access-parser>=0.0.6", "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0",
                "alembic>=1.13", "jinja2>=3.1", "python-multipart>=0.0.9", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
