[project]
name = "cutting-patterns"
version = "0.1.0"
description = "Sawing pattern simulator and generator for Thorpe Timbers (Ngome)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "access-parser>=0.0.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
